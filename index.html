<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bites.Co — Lumpia Pisang Bites 🍌</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --beige: #F5E6D3;
    --peach: #FAD4B8;
    --peach-light: #FCE4D0;
    --cream: #FFF9F0;
    --brown: #6B4226;
    --deep-brown: #3E2411;
    --choco: #4A2C17;
    --golden: #D89B4A;
    --golden-light: #F0B94E;
    --green: #7A9B76;
    --green-dark: #4F6B4C;
    --soft-shadow: rgba(107, 66, 38, 0.15);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--cream);
    color: var(--deep-brown);
    overflow-x: hidden;
    line-height: 1.6;
  }

  /* ===== NAVBAR ===== */
  nav {
    position: fixed;
    top: 0; width: 100%;
    padding: 14px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 249, 240, 0.88);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 1000;
    border-bottom: 1px solid rgba(216, 155, 74, 0.12);
  }

  .logo {
    font-family: 'Dancing Script', cursive;
    font-size: 2rem;
    font-weight: 700;
    color: var(--brown);
    letter-spacing: 0.5px;
  }
  .logo .dot { color: var(--golden); }

  .nav-links {
    display: flex;
    gap: 35px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--brown);
    font-weight: 500;
    font-size: 0.92rem;
    transition: color 0.3s;
    position: relative;
  }
  .nav-links a:hover { color: var(--golden); }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -5px; left: 0;
    width: 0; height: 2px;
    background: var(--golden);
    transition: width 0.3s;
    border-radius: 5px;
  }
  .nav-links a:hover::after { width: 100%; }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--brown);
    transition: all 0.3s;
    box-shadow: 0 4px 12px var(--soft-shadow);
    border: none;
    cursor: pointer;
    text-decoration: none;
  }

  .icon-btn:hover {
    transform: translateY(-3px);
    background: var(--golden);
    color: white;
    box-shadow: 0 8px 20px rgba(216, 155, 74, 0.35);
  }

  .icon-btn svg {
    width: 18px; height: 18px;
    fill: currentColor;
  }

  .icon-btn.wa { background: #25D366; color: white; }
  .icon-btn.wa:hover { background: #1da851; box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4); }

  .icon-btn.ig { background: linear-gradient(135deg, #833AB4, #FD1D1D, #FCAF45); color: white; }
  .icon-btn.tt { background: #000; color: white; }

  /* ===== HERO ===== */
  .hero {
    position: relative;
    min-height: 100vh;
    padding: 120px 6% 60px;
    background:
      radial-gradient(ellipse at 80% 20%, rgba(250, 212, 184, 0.6) 0%, transparent 55%),
      radial-gradient(ellipse at 20% 80%, rgba(245, 230, 211, 0.9) 0%, transparent 55%),
      linear-gradient(180deg, var(--beige) 0%, var(--cream) 100%);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 40px;
  }

  /* Tanaman hijau blur di kiri */
  .leaf-blur {
    position: absolute;
    left: -10%; top: 10%;
    width: 420px; height: 420px;
    background: radial-gradient(circle, var(--green) 0%, var(--green-dark) 60%, transparent 78%);
    border-radius: 50%;
    filter: blur(85px);
    opacity: 0.38;
    z-index: 0;
  }
  .leaf-blur-2 {
    position: absolute;
    left: 3%; bottom: 3%;
    width: 280px; height: 280px;
    background: radial-gradient(circle, var(--green) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(75px);
    opacity: 0.28;
    z-index: 0;
  }

  /* Daun dekoratif realistis */
  .leaf-shape {
    position: absolute;
    left: -20px; top: 25%;
    width: 200px; height: 90px;
    background: linear-gradient(135deg, var(--green-dark), var(--green));
    border-radius: 0 100% 0 100%;
    filter: blur(6px);
    opacity: 0.55;
    transform: rotate(-25deg);
    z-index: 1;
  }
  .leaf-shape-2 {
    position: absolute;
    left: 40px; top: 55%;
    width: 160px; height: 70px;
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    border-radius: 100% 0 100% 0;
    filter: blur(8px);
    opacity: 0.4;
    transform: rotate(15deg);
    z-index: 1;
  }

  /* Bokeh */
  .bokeh {
    position: absolute;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 50%;
    filter: blur(4px);
    animation: floatBokeh 6s ease-in-out infinite;
  }
  .bokeh-1 { top: 18%; left: 30%; width: 10px; height: 10px; }
  .bokeh-2 { top: 62%; left: 12%; width: 6px; height: 6px; animation-delay: 1.5s; }
  .bokeh-3 { top: 38%; left: 48%; width: 14px; height: 14px; animation-delay: 3s; }
  .bokeh-4 { top: 78%; left: 42%; width: 8px; height: 8px; animation-delay: 2s; }
  .bokeh-5 { top: 12%; left: 58%; width: 7px; height: 7px; animation-delay: 4s; }
  .bokeh-6 { top: 50%; left: 25%; width: 12px; height: 12px; animation-delay: 0.5s; }

  @keyframes floatBokeh {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
    50% { transform: translateY(-25px) scale(1.25); opacity: 0.85; }
  }

  /* ===== HERO VISUAL (FOTO PRODUK REALISTIS) ===== */
  .hero-visual {
    position: relative;
    z-index: 2;
    height: 640px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Tulisan handwritten "Bites.Co" di atas tengah */
  .handwritten-brand {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    font-family: 'Caveat', cursive;
    font-size: clamp(2.8rem, 6vw, 4.5rem);
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1;
    text-shadow:
      0 2px 4px rgba(107, 66, 38, 0.4),
      0 4px 12px rgba(62, 36, 17, 0.35),
      0 0 30px rgba(255, 255, 255, 0.4);
    z-index: 10;
    pointer-events: none;
    white-space: nowrap;
    letter-spacing: 1px;
  }

  .handwritten-brand .dot-co {
    color: #FFFFFF;
    font-size: 1.05em;
  }

  /* Foto produk utama */
  .photo-frame {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1400px;
  }

  /* ===== CUP PRODUK FOREGROUND (kiri bawah) ===== */
  .product-cup {
    position: absolute;
    bottom: 8%;
    left: 2%;
    width: 240px;
    transform: rotate(-8deg);
    z-index: 4;
    animation: floatCup1 5.5s ease-in-out infinite;
    filter: drop-shadow(0 30px 40px rgba(107, 66, 38, 0.4));
  }

  /* ===== CUP PRODUK BACKGROUND (kanan atas) ===== */
  .product-cup-2 {
    position: absolute;
    top: 12%;
    right: 2%;
    width: 210px;
    transform: rotate(7deg);
    z-index: 3;
    animation: floatCup2 6.5s ease-in-out infinite;
    filter: drop-shadow(0 25px 35px rgba(107, 66, 38, 0.35));
  }

  @keyframes floatCup1 {
    0%, 100% { transform: rotate(-8deg) translateY(0); }
    50% { transform: rotate(-6deg) translateY(-14px); }
  }
  @keyframes floatCup2 {
    0%, 100% { transform: rotate(7deg) translateY(0); }
    50% { transform: rotate(5deg) translateY(-12px); }
  }

  /* Cup plastik transparan */
  .plastic-cup {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1.1;
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0.45) 0%,
      rgba(255, 255, 255, 0.2) 40%,
      rgba(250, 212, 184, 0.3) 100%);
    border-radius: 12px 12px 20px 20px;
    border: 2px solid rgba(255, 255, 255, 0.85);
    box-shadow:
      inset 0 0 35px rgba(255, 255, 255, 0.55),
      inset -10px 0 22px rgba(255, 255, 255, 0.45),
      inset 10px 0 22px rgba(250, 212, 184, 0.3),
      0 18px 35px rgba(107, 66, 38, 0.28);
    overflow: hidden;
    backdrop-filter: blur(2px);
  }

  /* Tutup bening */
  .plastic-cup::before {
    content: '';
    position: absolute;
    top: -3px; left: 50%;
    transform: translateX(-50%);
    width: 105%; height: 24px;
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0.95) 0%,
      rgba(255, 255, 255, 0.65) 100%);
    border-radius: 10px 10px 6px 6px;
    border: 2px solid rgba(255, 255, 255, 0.95);
    box-shadow:
      inset 0 -3px 6px rgba(0, 0, 0, 0.06),
      0 5px 12px rgba(107, 66, 38, 0.18);
    z-index: 5;
  }

  /* Highlight tutup */
  .plastic-cup::after {
    content: '';
    position: absolute;
    top: 5px; left: 15%;
    width: 42%; height: 8px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 10px;
    filter: blur(2px);
    z-index: 6;
  }

  /* Isi cup - lumpia bites */
  .cup-fill {
    position: absolute;
    top: 20px; left: 0;
    width: 100%; height: calc(100% - 20px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: flex-start;
    gap: 2px;
    padding: 8px 6px;
    z-index: 1;
  }

  /* Lumpia bite - golden brown crispy */
  .bite {
    width: 28px;
    height: 22px;
    background: linear-gradient(135deg,
      #F5C663 0%,
      #E0A545 30%,
      #C8873A 60%,
      #A86A28 100%);
    border-radius: 6px 5px 6px 5px;
    position: relative;
    box-shadow:
      inset -2px -2px 4px rgba(107, 66, 38, 0.55),
      inset 2px 2px 3px rgba(255, 240, 200, 0.75),
      0 3px 5px rgba(62, 36, 17, 0.35);
    transform: rotate(var(--r, 0deg));
    flex-shrink: 0;
  }

  /* Tekstur crispy */
  .bite::before {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 22px; height: 1.5px;
    background: rgba(139, 69, 19, 0.45);
    border-radius: 3px;
    box-shadow:
      0 4px 0 rgba(139, 69, 19, 0.4),
      0 8px 0 rgba(139, 69, 19, 0.32),
      0 12px 0 rgba(139, 69, 19, 0.25),
      2px 16px 0 rgba(139, 69, 19, 0.2);
    transform: rotate(-4deg);
  }

  /* Pisang terlihat di dalam */
  .bite::after {
    content: '';
    position: absolute;
    top: 7px; right: 5px;
    width: 8px; height: 6px;
    background: radial-gradient(ellipse,
      #FAF0B8 0%,
      #EFD680 50%,
      #D9B95A 100%);
    border-radius: 50% 40% 50% 40%;
    box-shadow: inset -1px -1px 1.5px rgba(139, 69, 19, 0.4);
  }

  /* Cup saus coklat */
  .sauce-cup {
    position: absolute;
    bottom: -22px;
    right: -18px;
    width: 72px;
    height: 62px;
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0.92) 0%,
      rgba(250, 240, 230, 0.88) 100%);
    border-radius: 10px 10px 45% 45% / 10px 10px 55% 55%;
    border: 2px solid rgba(255, 255, 255, 0.95);
    box-shadow:
      inset 0 -6px 15px rgba(0, 0, 0, 0.06),
      0 10px 20px rgba(107, 66, 38, 0.32);
    z-index: 7;
    overflow: hidden;
    animation: floatCup1 4.5s ease-in-out infinite;
  }

  /* Saus coklat di dalam cup */
  .sauce-cup::before {
    content: '';
    position: absolute;
    top: 16px; left: 9px;
    width: 46px; height: 36px;
    background: radial-gradient(ellipse at 35% 30%,
      #7B4A28 0%,
      #5D3A1A 45%,
      #3E2411 100%);
    border-radius: 50%;
    box-shadow:
      inset -5px -5px 9px rgba(0, 0, 0, 0.55),
      inset 5px 5px 9px rgba(139, 90, 43, 0.6);
  }

  /* Highlight saus */
  .sauce-cup::after {
    content: '';
    position: absolute;
    top: 22px; left: 17px;
    width: 14px; height: 6px;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    filter: blur(2px);
    z-index: 2;
  }

  /* ===== TANGAN MEMEGANG CUP ===== */
  .hand {
    position: absolute;
    width: 100px;
    height: 130px;
    background: linear-gradient(135deg,
      #EBC0A0 0%,
      #D9A87F 45%,
      #C69068 100%);
    border-radius: 45% 45% 35% 35% / 50% 50% 42% 42%;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    box-shadow:
      inset -6px -6px 16px rgba(139, 90, 60, 0.35),
      inset 6px 6px 16px rgba(255, 225, 195, 0.55),
      0 12px 24px rgba(107, 66, 38, 0.22);
  }

  /* Ruas jari */
  .hand::before {
    content: '';
    position: absolute;
    top: -16px; left: 18px;
    width: 34px; height: 44px;
    background: linear-gradient(135deg, #EBC0A0, #D9A87F);
    border-radius: 50% 50% 32% 32%;
    box-shadow: inset -3px -3px 6px rgba(139, 90, 60, 0.32);
  }

  /* Jempol */
  .hand::after {
    content: '';
    position: absolute;
    top: 8px; right: 4px;
    width: 38px; height: 60px;
    background: linear-gradient(135deg, #EBC0A0, #D9A87F);
    border-radius: 45% 45% 50% 50%;
    transform: rotate(-22deg);
    box-shadow:
      inset -4px -4px 9px rgba(139, 90, 60, 0.38),
      inset 4px 4px 7px rgba(255, 225, 195, 0.55);
  }

  /* Kuku */
  .nail {
    position: absolute;
    top: -10px; right: 10px;
    width: 15px; height: 11px;
    background: linear-gradient(135deg, #FAE7D8, #EFC8A8);
    border-radius: 50%;
    box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.9);
    z-index: 3;
  }

  /* Bayangan tangan */
  .hand-shadow {
    position: absolute;
    bottom: -70px;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 30px;
    background: radial-gradient(ellipse, rgba(107, 66, 38, 0.4) 0%, transparent 72%);
    filter: blur(10px);
    z-index: 0;
  }

  /* ===== HERO TEXT ===== */
  .hero-text {
    position: relative;
    z-index: 5;
    max-width: 560px;
    padding-right: 20px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    background: white;
    border-radius: 50px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--brown);
    box-shadow: 0 6px 18px var(--soft-shadow);
    margin-bottom: 20px;
  }

  .hero-badge .dot-live {
    width: 8px; height: 8px;
    background: #25D366;
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  .hero-text h1 {
    font-size: clamp(2rem, 4.2vw, 3.1rem);
    font-weight: 800;
    line-height: 1.15;
    color: var(--deep-brown);
    margin-bottom: 18px;
    letter-spacing: -1px;
  }

  .hero-text h1 .accent {
    color: var(--golden);
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 1.15em;
  }

  .hero-text p {
    font-size: 1rem;
    color: var(--brown);
    margin-bottom: 30px;
    max-width: 480px;
    opacity: 0.9;
  }

  .hero-buttons {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 35px;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 32px;
    background: var(--brown);
    color: white;
    border: none;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 10px 25px rgba(107, 66, 38, 0.3);
    text-decoration: none;
  }

  .btn-primary:hover {
    transform: translateY(-4px);
    background: var(--deep-brown);
    box-shadow: 0 15px 35px rgba(107, 66, 38, 0.4);
  }

  .btn-primary svg { width: 18px; height: 18px; fill: currentColor; }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 15px 30px;
    background: white;
    color: var(--brown);
    border: 2px solid var(--brown);
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
  }

  .btn-secondary:hover { background: var(--peach); transform: translateY(-4px); }

  .hero-trust {
    display: flex;
    gap: 35px;
    padding-top: 25px;
    border-top: 1px solid rgba(107, 66, 38, 0.12);
  }

  .trust-item h3 {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--brown);
    line-height: 1;
  }
  .trust-item h3 span { color: var(--golden); }

  .trust-item p {
    font-size: 0.78rem;
    color: var(--brown);
    opacity: 0.7;
    margin-top: 5px;
    margin-bottom: 0;
  }

  /* ===== SECTION ===== */
  section { padding: 90px 6%; position: relative; }

  .section-header {
    text-align: center;
    margin-bottom: 60px;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
  }

  .section-label {
    display: inline-block;
    padding: 6px 18px;
    background: var(--peach-light);
    color: var(--brown);
    border-radius: 50px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 15px;
  }

  .section-header h2 {
    font-size: clamp(1.8rem, 3.5vw, 2.5rem);
    color: var(--deep-brown);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
  }

  .section-header h2 .hand-accent {
    font-family: 'Caveat', cursive;
    color: var(--golden);
    font-weight: 700;
    font-size: 1.2em;
  }

  .section-header p {
    color: var(--brown);
    opacity: 0.82;
    font-size: 1rem;
  }

  /* ===== KEUNGGULAN ===== */
  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .feature-card {
    background: white;
    padding: 35px 28px;
    border-radius: 24px;
    text-align: center;
    transition: all 0.4s;
    box-shadow: 0 8px 25px var(--soft-shadow);
    border: 1px solid rgba(216, 155, 74, 0.1);
  }

  .feature-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 45px rgba(107, 66, 38, 0.2);
    border-color: var(--peach);
  }

  .feature-icon {
    width: 70px; height: 70px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, var(--peach), var(--golden-light));
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    transition: transform 0.4s;
    box-shadow: 0 8px 20px rgba(216, 155, 74, 0.25);
  }

  .feature-card:hover .feature-icon {
    transform: rotate(-8deg) scale(1.08);
  }

  .feature-card h3 {
    color: var(--deep-brown);
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .feature-card p {
    color: var(--brown);
    font-size: 0.9rem;
    line-height: 1.6;
    opacity: 0.85;
  }

  /* ===== MENU ===== */
  .menu-section { background: linear-gradient(180deg, var(--cream), var(--beige)); }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .menu-card {
    background: white;
    border-radius: 26px;
    padding: 22px;
    transition: all 0.4s;
    box-shadow: 0 10px 30px var(--soft-shadow);
    position: relative;
    overflow: hidden;
  }

  .menu-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 25px 50px rgba(107, 66, 38, 0.2);
  }

  .menu-visual {
    width: 100%;
    height: 200px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--beige), var(--peach-light));
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
    position: relative;
