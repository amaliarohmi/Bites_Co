<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bites.Co — Lumpia Pisang Bites 🍌</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --beige: #F5E6D3;
    --peach: #FAD4B8;
    --peach-light: #FCE4D0;
    --cream: #FFF9F0;
    --brown: #6B4226;
    --deep-brown: #3E2411;
    --choco: #4A2C17;
    --golden: #D89B4A;
    --golden-light: #F0B94E;
    --green: #7A9B76;
    --green-dark: #4F6B4C;
    --soft-shadow: rgba(107, 66, 38, 0.15);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--cream);
    color: var(--deep-brown);
    overflow-x: hidden;
    line-height: 1.6;
  }

  /* ===== NAVBAR ===== */
  nav {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 16px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 249, 240, 0.85);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 1000;
    border-bottom: 1px solid rgba(216, 155, 74, 0.12);
  }

  .logo {
    font-family: 'Dancing Script', cursive;
    font-size: 2rem;
    font-weight: 700;
    color: var(--brown);
    letter-spacing: 0.5px;
  }

  .logo .dot { color: var(--golden); }

  .nav-links {
    display: flex;
    gap: 35px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--brown);
    font-weight: 500;
    font-size: 0.92rem;
    transition: color 0.3s;
    position: relative;
  }

  .nav-links a:hover { color: var(--golden); }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--golden);
    transition: width 0.3s;
    border-radius: 5px;
  }

  .nav-links a:hover::after { width: 100%; }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    color: var(--brown);
    transition: all 0.3s;
    box-shadow: 0 4px 12px var(--soft-shadow);
    border: none;
    cursor: pointer;
  }

  .icon-btn:hover {
    transform: translateY(-3px);
    background: var(--golden);
    color: white;
    box-shadow: 0 8px 20px rgba(216, 155, 74, 0.35);
  }

  .icon-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  .icon-btn.wa {
    background: #25D366;
    color: white;
  }

  .icon-btn.wa:hover {
    background: #1da851;
    box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
  }

  /* ===== HERO ===== */
  .hero {
    position: relative;
    min-height: 100vh;
    padding: 110px 6% 60px;
    background: 
      radial-gradient(ellipse at 80% 20%, rgba(250, 212, 184, 0.6) 0%, transparent 50%),
      radial-gradient(ellipse at 20% 80%, rgba(245, 230, 211, 0.8) 0%, transparent 50%),
      linear-gradient(180deg, var(--beige) 0%, var(--cream) 100%);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 40px;
  }

  /* Dekorasi tanaman hijau blur di kiri */
  .leaf-blur {
    position: absolute;
    left: -8%;
    top: 15%;
    width: 380px;
    height: 380px;
    background: radial-gradient(circle, var(--green) 0%, var(--green-dark) 60%, transparent 75%);
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    z-index: 0;
  }

  .leaf-blur-2 {
    position: absolute;
    left: 5%;
    bottom: 5%;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, var(--green) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.25;
    z-index: 0;
  }

  /* Bokeh effect */
  .bokeh {
    position: absolute;
    width: 8px;
    height: 8px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 50%;
    filter: blur(3px);
    animation: floatBokeh 6s ease-in-out infinite;
  }

  .bokeh-1 { top: 20%; left: 30%; animation-delay: 0s; }
  .bokeh-2 { top: 60%; left: 15%; animation-delay: 1.5s; width: 5px; height: 5px; }
  .bokeh-3 { top: 35%; left: 45%; animation-delay: 3s; width: 10px; height: 10px; }
  .bokeh-4 { top: 75%; left: 40%; animation-delay: 2s; }
  .bokeh-5 { top: 15%; left: 55%; animation-delay: 4s; width: 6px; height: 6px; }

  @keyframes floatBokeh {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
    50% { transform: translateY(-30px) scale(1.3); opacity: 0.8; }
  }

  /* ===== HERO TEXT ===== */
  .hero-text {
    position: relative;
    z-index: 2;
    max-width: 560px;
  }

  .handwritten-title {
    position: absolute;
    top: -230px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-family: 'Caveat', cursive;
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 700;
    color: white;
    line-height: 1;
    text-shadow: 
      2px 2px 8px rgba(62, 36, 17, 0.35),
      0 0 20px rgba(255, 255, 255, 0.3);
    z-index: 5;
    pointer-events: none;
    white-space: nowrap;
    letter-spacing: 2px;
  }

  .handwritten-title .line-2 {
    display: block;
    font-size: 1.15em;
    margin-top: -10px;
    transform: rotate(-2deg);
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    background: white;
    border-radius: 50px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--brown);
    box-shadow: 0 6px 18px var(--soft-shadow);
    margin-bottom: 20px;
  }

  .hero-badge .dot-live {
    width: 8px;
    height: 8px;
    background: #25D366;
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  .hero-text h1 {
    font-size: clamp(2rem, 4.5vw, 3.2rem);
    font-weight: 800;
    line-height: 1.15;
    color: var(--deep-brown);
    margin-bottom: 18px;
    letter-spacing: -1px;
  }

  .hero-text h1 .accent {
    color: var(--golden);
    font-family: 'Caveat', cursive;
    font-weight: 700;
  }

  .hero-text p {
    font-size: 1.05rem;
    color: var(--brown);
    margin-bottom: 30px;
    max-width: 480px;
    opacity: 0.9;
  }

  .hero-buttons {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 35px;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 32px;
    background: var(--brown);
    color: white;
    border: none;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 10px 25px rgba(107, 66, 38, 0.3);
    text-decoration: none;
  }

  .btn-primary:hover {
    transform: translateY(-4px);
    background: var(--deep-brown);
    box-shadow: 0 15px 35px rgba(107, 66, 38, 0.4);
  }

  .btn-primary svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 15px 30px;
    background: white;
    color: var(--brown);
    border: 2px solid var(--brown);
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
  }

  .btn-secondary:hover {
    background: var(--peach);
    transform: translateY(-4px);
  }

  .hero-trust {
    display: flex;
    gap: 35px;
    padding-top: 25px;
    border-top: 1px solid rgba(107, 66, 38, 0.12);
  }

  .trust-item h3 {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--brown);
    line-height: 1;
  }

  .trust-item h3 span { color: var(--golden); }

  .trust-item p {
    font-size: 0.8rem;
    color: var(--brown);
    opacity: 0.7;
    margin-top: 5px;
    margin-bottom: 0;
  }

  /* ===== HERO VISUAL - Realistic Product Photo ===== */
  .hero-visual {
    position: relative;
    z-index: 2;
    height: 620px;
    perspective: 1200px;
  }

  .product-shot {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* Cup produk - foreground kiri bawah */
  .cup-foreground {
    position: absolute;
    bottom: 8%;
    left: 0%;
    width: 220px;
    transform: rotate(-8deg);
    z-index: 3;
    animation: floatCup1 5s ease-in-out infinite;
    filter: drop-shadow(0 25px 35px rgba(107, 66, 38, 0.35));
  }

  /* Cup produk - tengah/kanan atas */
  .cup-background {
    position: absolute;
    top: 5%;
    right: 0%;
    width: 200px;
    transform: rotate(6deg);
    z-index: 2;
    animation: floatCup2 6s ease-in-out infinite;
    filter: drop-shadow(0 25px 35px rgba(107, 66, 38, 0.3));
  }

  @keyframes floatCup1 {
    0%, 100% { transform: rotate(-8deg) translateY(0); }
    50% { transform: rotate(-6deg) translateY(-12px); }
  }

  @keyframes floatCup2 {
    0%, 100% { transform: rotate(6deg) translateY(0); }
    50% { transform: rotate(4deg) translateY(-10px); }
  }

  /* Cup plastik transparan */
  .plastic-cup {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1.1;
    background: linear-gradient(180deg, 
      rgba(255, 255, 255, 0.5) 0%, 
      rgba(255, 255, 255, 0.25) 40%,
      rgba(250, 212, 184, 0.35) 100%);
    border-radius: 12px 12px 18px 18px;
    border: 2px solid rgba(255, 255, 255, 0.8);
    box-shadow: 
      inset 0 0 30px rgba(255, 255, 255, 0.5),
      inset -8px 0 20px rgba(255, 255, 255, 0.4),
      0 15px 30px rgba(107, 66, 38, 0.25);
    overflow: hidden;
    backdrop-filter: blur(2px);
  }

  /* Tutup bening */
  .plastic-cup::before {
    content: '';
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 104%;
    height: 22px;
    background: linear-gradient(180deg, 
      rgba(255, 255, 255, 0.9) 0%, 
      rgba(255, 255, 255, 0.6) 100%);
    border-radius: 10px 10px 6px 6px;
    border: 2px solid rgba(255, 255, 255, 0.95);
    box-shadow: 
      inset 0 -3px 6px rgba(0,0,0,0.05),
      0 4px 10px rgba(107, 66, 38, 0.15);
    z-index: 3;
  }

  /* Highlight pada tutup */
  .plastic-cup::after {
    content: '';
    position: absolute;
    top: 4px;
    left: 15%;
    width: 40%;
    height: 8px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 10px;
    filter: blur(2px);
    z-index: 4;
  }

  /* Isi cup - lumpia bites */
  .cup-fill {
    position: absolute;
    top: 18px;
    left: 0;
    width: 100%;
    height: calc(100% - 18px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: flex-start;
    gap: 2px;
    padding: 8px 6px;
    z-index: 1;
  }

  /* Lumpia bites mini - golden brown */
  .bite {
    width: 26px;
    height: 20px;
    background: linear-gradient(135deg, 
      #F0B94E 0%, 
      #D89B4A 40%, 
      #B87830 100%);
    border-radius: 5px;
    position: relative;
    box-shadow: 
      inset -2px -2px 4px rgba(107, 66, 38, 0.5),
      inset 2px 2px 3px rgba(255, 240, 200, 0.7),
      0 2px 4px rgba(62, 36, 17, 0.3);
    transform: rotate(var(--r, 0deg));
    flex-shrink: 0;
  }

  /* Tekstur crispy - garis-garis */
  .bite::before {
    content: '';
    position: absolute;
    top: 3px;
    left: 2px;
    width: 20px;
    height: 1.5px;
    background: rgba(139, 69, 19, 0.4);
    border-radius: 3px;
    box-shadow: 
      0 4px 0 rgba(139, 69, 19, 0.35),
      0 8px 0 rgba(139, 69, 19, 0.3),
      2px 12px 0 rgba(139, 69, 19, 0.25);
    transform: rotate(-5deg);
  }

  /* Pisang terlihat di dalam */
  .bite::after {
    content: '';
    position: absolute;
    top: 6px;
    right: 4px;
    width: 7px;
    height: 5px;
    background: radial-gradient(ellipse, #F5E6A8 0%, #E8C97A 100%);
    border-radius: 50% 40% 50% 40%;
    box-shadow: inset -1px -1px 1px rgba(139, 69, 19, 0.3);
  }

  /* Cup saus coklat kecil */
  .sauce-cup {
    position: absolute;
    bottom: -18px;
    right: -20px;
    width: 65px;
    height: 55px;
    background: linear-gradient(180deg, 
      rgba(255, 255, 255, 0.9) 0%, 
      rgba(250, 240, 230, 0.85) 100%);
    border-radius: 8px 8px 40% 40% / 8px 8px 50% 50%;
    border: 2px solid rgba(255, 255, 255, 0.95);
    box-shadow: 
      inset 0 -5px 15px rgba(0,0,0,0.05),
      0 8px 18px rgba(107, 66, 38, 0.3);
    z-index: 5;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 5px;
    overflow: hidden;
  }

  .sauce-cup::before {
    content: '';
    position: absolute;
    top: 15px;
    left: 8px;
    width: 40px;
    height: 32px;
    background: radial-gradient(ellipse at 35% 30%, 
      #6B4226 0%, 
      #4A2C17 50%, 
      #2E1A0E 100%);
    border-radius: 50%;
    box-shadow: 
      inset -4px -4px 8px rgba(0,0,0,0.5),
      inset 4px 4px 8px rgba(139, 90, 43, 0.6);
  }

  /* Highlight coklat */
  .sauce-cup::after {
    content: '';
    position: absolute;
    top: 20px;
    left: 15px;
    width: 12px;
    height: 5px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 50%;
    filter: blur(2px);
    z-index: 2;
  }

  /* Tangan memegang cup (realistis) */
  .hand {
    position: absolute;
    width: 90px;
    height: 120px;
    background: linear-gradient(135deg, 
      #E8B896 0%, 
      #D4A17A 50%, 
      #C08E68 100%);
    border-radius: 45% 45% 35% 35% / 50% 50% 40% 40%;
    bottom: -50px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 0;
    box-shadow: 
      inset -5px -5px 15px rgba(139, 90, 60, 0.3),
      inset 5px 5px 15px rgba(255, 220, 190, 0.5),
      0 10px 20px rgba(107, 66, 38, 0.2);
  }

  .hand::before {
    content: '';
    position: absolute;
    top: -15px;
    left: 15px;
    width: 30px;
    height: 40px;
    background: linear-gradient(135deg, #E8B896, #D4A17A);
    border-radius: 50% 50% 30% 30%;
    box-shadow: inset -2px -2px 5px rgba(139, 90, 60, 0.3);
  }

  /* Jempol */
  .hand::after {
    content: '';
    position: absolute;
    top: 10px;
    right: 5px;
    width: 35px;
    height: 55px;
    background: linear-gradient(135deg, #E8B896, #D4A17A);
    border-radius: 45% 45% 50% 50%;
    transform: rotate(-20deg);
    box-shadow: 
      inset -3px -3px 8px rgba(139, 90, 60, 0.35),
      inset 3px 3px 6px rgba(255, 220, 190, 0.5);
  }

  /* Detail kuku */
  .nail {
    position: absolute;
    top: -8px;
    right: 8px;
    width: 14px;
    height: 10px;
    background: linear-gradient(135deg, #F5E0D0, #E8C5A8);
    border-radius: 50%;
    box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.8);
    z-index: 1;
  }

  /* Bayangan tangan */
  .hand-shadow {
    position: absolute;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 25px;
    background: radial-gradient(ellipse, rgba(107, 66, 38, 0.35) 0%, transparent 70%);
    filter: blur(8px);
    z-index: -1;
  }

  /* ===== SECTION STYLING ===== */
  section {
    padding: 90px 6%;
    position: relative;
  }

  .section-header {
    text-align: center;
    margin-bottom: 60px;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
  }

  .section-label {
    display: inline-block;
    padding: 6px 18px;
    background: var(--peach-light);
    color: var(--brown);
    border-radius: 50px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 15px;
  }

  .section-header h2 {
    font-size: clamp(1.8rem, 3.5vw, 2.6rem);
    color: var(--deep-brown);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
  }

  .section-header h2 .hand-accent {
    font-family: 'Caveat', cursive;
    color: var(--golden);
    font-weight: 700;
  }

  .section-header p {
    color: var(--brown);
    opacity: 0.8;
    font-size: 1rem;
  }

  /* ===== KEUNGGULAN ===== */
  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .feature-card {
    background: white;
    padding: 35px 28px;
    border-radius: 24px;
    text-align: center;
    transition: all 0.4s;
    box-shadow: 0 8px 25px var(--soft-shadow);
    border: 1px solid rgba(216, 155, 74, 0.1);
  }

  .feature-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 45px rgba(107, 66, 38, 0.2);
    border-color: var(--peach);
  }

  .feature-icon {
    width: 70px;
    height: 70px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, var(--peach), var(--golden-light));
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    transition: transform 0.4s;
    box-shadow: 0 8px 20px rgba(216, 155, 74, 0.25);
  }

  .feature-card:hover .feature-icon {
    transform: rotate(-8deg) scale(1.08);
  }

  .feature-card h3 {
    color: var(--deep-brown);
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .feature-card p {
    color: var(--brown);
    font-size: 0.9rem;
    line-height: 1.6;
    opacity: 0.85;
  }

  /* ===== MENU ===== */
  .menu-section {
    background: linear-gradient(180deg, var(--cream), var(--beige));
  }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .menu-card {
    background: white;
    border-radius: 26px;
    padding: 22px;
    transition: all 0.4s;
    box-shadow: 0 10px 30px var(--soft-shadow);
    position: relative;
    overflow: hidden;
  }

  .menu-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 25px 50px rgba(107, 66, 38, 0.2);
  }

  .menu-visual {
    width: 100%;
    height: 200px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--beige), var(--peach-light));
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  .mini-cup {
    width: 80px;
    height: 95px;
    background: linear-gradient(180deg, 
      rgba(255, 255, 255, 0.6) 0%, 
      rgba(255, 255, 255, 0.3) 100%);
    border: 2px solid rgba(255, 255, 255, 0.9);
    border-radius: 8px 8px 12px 12px;
    position: relative;
    box-shadow: 
      inset 0 0 15px rgba(255, 255, 255, 0.6),
      0 10px 20px rgba(107, 66, 38, 0.2);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: flex-start;
    gap: 2px;
    padding: 6px 4px;
    overflow: hidden;
  }

  .mini-cup::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2%;
    width: 104%;
    height: 12px;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 6px 6px 3px 3px;
    border: 1.5px solid rgba(255, 255, 255, 0.95);
    z-index: 2;
  }

  .mini-bite {
    width: 16px;
    height: 12px;
